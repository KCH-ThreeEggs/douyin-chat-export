name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-desktop-installer
    paths:
      - "backend/**"
      - "common/**"
      - "desktop/**"
      - "extractor/**"
      - "frontend/**"
      - "packaging/windows/**"
      - "requirements*.txt"
      - "extract.py"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "common/**"
      - "desktop/**"
      - "extractor/**"
      - "frontend/**"
      - "packaging/windows/**"
      - "requirements*.txt"
      - "extract.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Validate desktop bootstrap
        shell: pwsh
        run: |
          python -m compileall -q backend common desktop extractor extract.py
          $env:DOUYIN_CHAT_DATA_DIR = "$env:RUNNER_TEMP\DouyinChatExporter\data"
          python -c "from extractor.models import init_db; from common import paths; init_db(); assert paths.DB_PATH.startswith(r'$env:RUNNER_TEMP'); print(paths.DB_PATH)"
          python -c "from desktop.main import _worker_args_from_process_argv as p; assert p(['-u','extract.py','--incremental']) == ['extract','--incremental']"

      - name: Bundle Playwright Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\build\ms-playwright"
          python -m playwright install chromium
          if (-not (Test-Path $env:PLAYWRIGHT_BROWSERS_PATH)) {
            throw "Playwright browser bundle was not created"
          }

      - name: Build application directory
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging\windows\douyin-chat-export.spec
          if (-not (Test-Path "dist\DouyinChatExporter\DouyinChatExporter.exe")) {
            throw "PyInstaller executable was not created"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }
          & $iscc "/DAppVersion=0.1.${{ github.run_number }}" "packaging\windows\installer.iss"
          if (-not (Test-Path "dist\installer\DouyinChatExporter-Setup-x64.exe")) {
            throw "Installer was not created"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DouyinChatExporter-Windows-x64
          path: dist/installer/DouyinChatExporter-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
